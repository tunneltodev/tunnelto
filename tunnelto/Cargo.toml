[package]
name = "tunnelto"
description = "expose your local web server to the internet with a public url"
version = "0.2.0"
authors = ["Alex Grinman <alex@tunnelto.dev>"]
license = "MIT"
repository = "https://github.com/tunneltodev/tunnelto"
readme = "../README.md"
edition = "2021"

[[bin]]
name = "tunnelto"
path = "src/main.rs"

[[bin]]
name = "tunn"
path = "src/bin/tunn.rs"

[dependencies]
tunnelto_protocol = { version = "0.2.0", path = "../tunnelto_protocol" }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
] }
lazy_static = "1.4.0"
pretty_env_logger = "0.5"
dirs = "2.0.2"
log = "0.4.8"
human-panic = "2"
clap = { version = "4.5", features = ["derive"] }
colored = "1.9.3"
thiserror = "1.0"
indicatif = "0.15.0"
httparse = "1.3.4"
warp = { version = "0.4", features = ["server"] }
bytes = "1.0"
askama = { version = "0.9.0", features = ["serde-json"] }
chrono = "0.4.11"
uuid = { version = "0.8.1", features = ["serde", "v4"] }
serde_urlencoded = "0.6.1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
cli-table = "0.4"
semver = "0.11"
webpki-roots = "1.0"
