name: Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build All
        run: cargo build --locked --verbose
      - name: Test All
        run: cargo test --locked --all
      - name: CLI runs
        run: |
          cargo run --locked -q --bin tunnelto -- --version
          cargo run --locked -q --bin tunn -- --version
