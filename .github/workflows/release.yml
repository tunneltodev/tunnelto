name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build"
        required: true
        type: string
      writeLatest:
        description: "Overwrite the latest release"
        required: true
        default: true
        type: boolean
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: tag if needed
        if: ${{ inputs.version }}
        uses: mathieudutour/github-tag-action@v6.2
        with:
          custom_tag: ${{ inputs.version }}
          tag_prefix: ""
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - id: get_version
        run: echo "version=${{inputs.version || github.ref_name}}" >> "$GITHUB_OUTPUT"

  build:
    needs: [setup]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Asset names must match `uname -s`-`uname -m`, which install.sh uses
          # to pick a download. Linux builds on 22.04 so the binaries run on
          # distros with glibc 2.35 or newer.
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: Linux-x86_64 }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, asset: Linux-aarch64 }
          - { runner: macos-latest, target: aarch64-apple-darwin, asset: Darwin-arm64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, asset: Darwin-x86_64 }

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p tunnelto --target ${{ matrix.target }}

      - name: Smoke test
        if: ${{ matrix.target != 'x86_64-apple-darwin' }}
        run: |
          target/${{ matrix.target }}/release/tunnelto --version
          target/${{ matrix.target }}/release/tunn --version

      - name: Compress
        run: |
          mkdir -p app
          cp target/${{ matrix.target }}/release/tunnelto app/tunnelto
          cp target/${{ matrix.target }}/release/tunn app/tunn
          tar -czvf "${{ matrix.asset }}.tar.gz" app/tunnelto app/tunn

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}.tar.gz
          path: ${{ matrix.asset }}.tar.gz

  publish_release:
    name: Publish Release
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create version release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ needs.setup.outputs.version }}
          tag: ${{ needs.setup.outputs.version }}
          allowUpdates: true
          # Tag pushes are real releases: make them "latest", which is what
          # install.sh downloads. Manual runs follow the writeLatest input.
          makeLatest: ${{ github.event_name == 'push' || inputs.writeLatest }}
          artifacts: "artifacts/*.tar.gz"
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo_publish:
    name: Cargo publish
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked -p tunnelto_protocol --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
      - run: cargo publish --locked -p tunnelto --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  brew_bump:
    name: Brew bump
    needs: [setup, build]
    runs-on: macos-latest
    steps:
      - name: Bump Brew
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: "tunnelto"
          formula-path: "tunnelto.rb"
          tag-name: "${{ needs.setup.outputs.version}}"
          download-url: "https://github.com/tunneltodev/tunnelto/archive/refs/tags/${{ needs.setup.outputs.version }}.tar.gz"
          homebrew-tap: "tunneltodev/homebrew-tap"
        env:
          COMMITTER_TOKEN: ${{ secrets.BREW_TOKEN }}
